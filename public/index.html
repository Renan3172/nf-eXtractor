<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extrator NF-e — XML e DANFE</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-xl bg-white rounded-2xl shadow-lg p-6 space-y-6">
    <!-- Cabeçalho -->
    <div class="flex items-center justify-between border-b border-slate-200 pb-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Extrator de NF-e</h1>
        <p class="text-sm text-slate-500">Envie ou cole a imagem da DANFE para baixar XML e PDF</p>
      </div>
      <button
        id="btnConfig"
        type="button"
        title="Configurar Chave API"
        class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition"
      >
        ⚙️
      </button>
    </div>

    <!-- Aviso se a chave do Gemini não estiver configurada -->
    <div id="avisoChave" class="hidden bg-amber-50 border border-amber-300 text-amber-800 text-sm rounded-lg p-3">
      Configure sua <strong>Chave de API do Google Gemini</strong> clicando no ícone ⚙️ acima antes de enviar uma nota.
    </div>

    <!-- Área de Upload / Colar -->
    <div
      id="dropZone"
      class="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl p-8 text-center cursor-pointer transition bg-slate-50"
    >
      <input id="fileInput" type="file" accept="image/*" class="hidden" />
      <div id="placeholderUpload" class="space-y-2">
        <p class="text-slate-700 font-medium">Arraste a imagem aqui, clique para selecionar ou pressione <kbd class="px-1.5 py-0.5 bg-slate-200 rounded text-xs">Ctrl + V</kbd></p>
        <p class="text-xs text-slate-400">Suporta PNG, JPG e WEBP</p>
      </div>
      <div id="previewContainer" class="hidden space-y-3">
        <img id="previewImg" src="" alt="Prévia da DANFE" class="max-h-60 mx-auto rounded-lg shadow-sm border border-slate-200" />
        <p id="fileName" class="text-xs text-slate-500 truncate"></p>
      </div>
    </div>

    <!-- Botão Principal -->
    <button
      id="btnProcessar"
      type="button"
      disabled
      class="w-full py-3 px-4 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed transition flex items-center justify-center gap-2"
    >
      <span id="btnTexto">Extrair Chave e Baixar XML / PDF</span>
      <svg id="spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
    </button>

    <!-- Mensagem de Erro -->
    <div id="boxErro" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl p-4 break-words"></div>

    <!-- Resultado -->
    <div id="boxResultado" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-4 space-y-4">
      <div>
        <span class="text-xs font-semibold uppercase tracking-wide text-emerald-700">Chave de Acesso (44 dígitos)</span>
        <div class="mt-1 flex items-center gap-2">
          <code id="chaveTexto" class="flex-1 bg-white border border-emerald-200 rounded-lg px-3 py-2 text-xs sm:text-sm font-mono text-slate-800 break-all"></code>
          <button
            id="btnCopiar"
            type="button"
            class="px-3 py-2 text-xs font-medium bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition"
          >
            Copiar
          </button>
        </div>
      </div>

      <div class="flex flex-wrap gap-3">
        <button
          id="btnBaixarXml"
          type="button"
          class="hidden flex-1 py-2.5 px-4 rounded-lg bg-slate-900 hover:bg-slate-
