<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extrator NF-e — XML e DANFE</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-xl bg-white rounded-2xl shadow-lg p-6 space-y-6">
    <!-- Cabeçalho -->
    <div class="flex items-center justify-between border-b border-slate-200 pb-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Extrator de NF-e</h1>
        <p class="text-sm text-slate-500">Envie ou cole a imagem da DANFE para baixar XML e PDF</p>
      </div>
      <button
        id="btnConfig"
        type="button"
        title="Configurar Chave API"
        class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition cursor-pointer"
      >
        ⚙️
      </button>
    </div>

    <!-- Aviso se a chave do Gemini não estiver configurada -->
    <div id="avisoChave" class="hidden bg-amber-50 border border-amber-300 text-amber-800 text-sm rounded-lg p-3">
      Configure sua <strong>Chave de API do Google Gemini</strong> clicando no ícone ⚙️ acima antes de enviar uma nota.
    </div>

    <!-- Área de Upload / Colar -->
    <div
      id="dropZone"
      class="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl p-8 text-center cursor-pointer transition bg-slate-50"
    >
      <input id="fileInput" type="file" accept="image/*" class="hidden" />
      <div id="placeholderUpload" class="space-y-2">
        <p class="text-slate-700 font-medium">Arraste a imagem aqui, clique para selecionar ou pressione <kbd class="px-1.5 py-0.5 bg-slate-200 rounded text-xs">Ctrl + V</kbd></p>
        <p class="text-xs text-slate-400">Suporta PNG, JPG e WEBP</p>
      </div>
      <div id="previewContainer" class="hidden space-y-3">
        <img id="previewImg" src="" alt="Prévia da DANFE" class="max-h-60 mx-auto rounded-lg shadow-sm border border-slate-200" />
        <p id="fileName" class="text-xs text-slate-500 truncate"></p>
      </div>
    </div>

      type="button"
